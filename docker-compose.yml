services:
    app:
        build: .
        ports:
            - "8000:8000"
        volumes:
            - ./:/var/www/html
        environment:
            DB_HOST: postgres
            MONGODB_URI: mongodb+srv://lfcandido:Ps4foda4@cluster01.tjtmgh4.mongodb.net/?appName=Cluster01
        depends_on:
            - postgres
            - mongo

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: TecSupDB
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: ps4foda4
        volumes:
            - postgres_data:/var/lib/postgresql/data

    mongo:
        image: mongo:7
        volumes:
            - mongo_data:/data/db

    node:
        image: node:22-alpine
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        command: sh -c "npm install && npm run dev -- --host"
        ports:
            - "5173:5173"

volumes:
    postgres_data:
    mongo_data:
